<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jorge Amorim - CV</title>
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; color: #333; margin: 0; line-height: 1.6; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid #ddd; }
    nav { display: flex; gap: 1.5rem; }
    nav a { color: #555; text-decoration: none; }
    nav a.ativo { color: #1f7a6f; font-weight: bold; }
    .menu-toggle { display: none; }
    .hobbies { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 1rem; }
    .hobbies button { padding: 1rem 1.5rem; }
    .fundo { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .5); }
    .modal { max-width: 480px; margin: 1rem; padding: 2rem; background: #fff; border-radius: 8px; }
    footer { padding: 1rem; text-align: center; border-top: 1px solid #ddd; }
    footer a { margin: 0 1rem; color: #555; }
    #app { min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; width: 100%; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    @media (max-width: 640px) {
        .menu-toggle { display: block; }
        nav { display: none; flex-direction: column; width: 100%; }
        nav.aberto { display: flex; }
    }
    </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Jorge Amorim</h1>
      <button class="menu-toggle" :aria-expanded="menuAberto" aria-controls="menu" aria-label="Menu" @click="menuAberto = !menuAberto">
        {{ menuAberto ? '✕' : '☰' }}
      </button>
      <nav id="menu" :class="{ aberto: menuAberto }">
        <a href="#/quem-sou-eu" :class="{ ativo: seccaoAtiva === 'quem-sou-eu' }" :aria-current="seccaoAtiva === 'quem-sou-eu' ? 'page' : null" @click="menuAberto = false">Quem Sou Eu?</a>
        <a href="#/o-que-faco" :class="{ ativo: seccaoAtiva === 'o-que-faco' }" :aria-current="seccaoAtiva === 'o-que-faco' ? 'page' : null" @click="menuAberto = false">O que faço?</a>
        <a href="#/hobbies" :class="{ ativo: seccaoAtiva === 'hobbies' }" :aria-current="seccaoAtiva === 'hobbies' ? 'page' : null" @click="menuAberto = false">Hobbies</a>
      </nav>
    </header>

    <main>
      <section v-if="seccaoAtiva === 'quem-sou-eu'">
        <h2>Quem Sou Eu?</h2>
        <p>A preencher.</p>
      </section>
      <section v-if="seccaoAtiva === 'o-que-faco'">
        <h2>O que faço?</h2>
        <p>A preencher.</p>
      </section>
      <section v-if="seccaoAtiva === 'hobbies'">
        <h2>Hobbies</h2>
        <ul class="hobbies">
          <li v-for="h in hobbies" :key="h.nome">
            <button @click="hobbyAberto = h">{{ h.nome }}</button>
          </li>
        </ul>
      </section>
    </main>

    <div v-if="hobbyAberto" class="fundo" @click.self="hobbyAberto = null">
      <div class="modal">
        <h3>{{ hobbyAberto.nome }}</h3>
        <p>{{ hobbyAberto.texto }}</p>
        <button @click="hobbyAberto = null">Fechar</button>
      </div>
    </div>

    <footer>
        <a href="https://github.com/jfbamorim" aria-label="GitHub">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        </a>
        <a href="https://pt.linkedin.com/in/jorge-amorim-316969108" aria-label="LinkedIn">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        </a>
    </footer>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const vistas = ['quem-sou-eu', 'o-que-faco', 'hobbies']

        function lerHash(){
            const vista = location.hash.replace('#/', '');
            return vistas.includes(vista) ? vista : 'quem-sou-eu';
        }

        const seccaoAtiva = ref(lerHash());
        const hobbyAberto = ref(null);
        const menuAberto = ref(false);
        const hobbies = [
            { nome: 'Fitboxing', texto: 'A preecnher' },
            { nome: 'Jogos de tabuleiro', texto: 'A preecnher' },
            { nome: 'Projetos Pessoais', texto: 'A preecnher' },
            { nome: 'Leitura', texto: 'A preecnher' },
            { nome: 'Aprendizagem musical', texto: 'A preecnher' }
        ];

        window.addEventListener('hashchange', () =>{
            seccaoAtiva.value = lerHash();
            hobbyAberto.value = null; //adicionada caso o hash mude por outro meio, o modal não permanecer aberto.
        });

        return { seccaoAtiva, hobbyAberto, menuAberto, hobbies };
      }
    }).mount('#app');
  </script>
</body>
</html>
