<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jorge Amorim - CV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; color: #333; margin: 0; line-height: 1.6; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid #ddd; }
    nav { display: flex; gap: 1.5rem; }
    nav a { color: #555; text-decoration: none; }
    nav a.ativo { color: #1f7a6f; font-weight: bold; }
    .menu-toggle { display: none; }
    main { max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    .hobbies { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 1rem; }
    .hobbies button { padding: 1rem 1.5rem; }
    .fundo { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .5); }
    .modal { max-width: 480px; margin: 1rem; padding: 2rem; background: #fff; border-radius: 8px; }
    footer { padding: 1rem; text-align: center; border-top: 1px solid #ddd; }
    footer a { margin: 0 1rem; color: #555; }

    @media (max-width: 640px) {
        .menu-toggle { display: block; }
        nav { display: none; flex-direction: column; width: 100%; }
        nav.aberto { display: flex; }
    }
    </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Jorge Amorim</h1>
      <button class="menu-toggle" :aria-expanded="menuAberto" aria-controls="menu" aria-label="Menu" @click="menuAberto = !menuAberto">
        {{ menuAberto ? '✕' : '☰' }}
      </button>
      <nav id="menu" :class="{ aberto: menuAberto }">
        <a href="#/quem-sou-eu" :class="{ ativo: seccaoAtiva === 'quem-sou-eu' }" :aria-current="seccaoAtiva === 'quem-sou-eu' ? 'page' : null" @click="menuAberto = false">Quem Sou Eu?</a>
        <a href="#/o-que-faco" :class="{ ativo: seccaoAtiva === 'o-que-faco' }" :aria-current="seccaoAtiva === 'o-que-faco' ? 'page' : null" @click="menuAberto = false">O que faço?</a>
        <a href="#/hobbies" :class="{ ativo: seccaoAtiva === 'hobbies' }" :aria-current="seccaoAtiva === 'hobbies' ? 'page' : null" @click="menuAberto = false">Hobbies</a>
      </nav>
    </header>

    <main>
      <section v-if="seccaoAtiva === 'quem-sou-eu'">
        <h2>Quem Sou Eu?</h2>
        <p>A preencher.</p>
      </section>
      <section v-if="seccaoAtiva === 'o-que-faco'">
        <h2>O que faço?</h2>
        <p>A preencher.</p>
      </section>
      <section v-if="seccaoAtiva === 'hobbies'">
        <h2>Hobbies</h2>
        <ul class="hobbies">
          <li v-for="h in hobbies" :key="h.nome">
            <button @click="hobbyAberto = h">{{ h.nome }}</button>
          </li>
        </ul>
      </section>
    </main>

    <div v-if="hobbyAberto" class="fundo" @click.self="hobbyAberto = null">
      <div class="modal">
        <h3>{{ hobbyAberto.nome }}</h3>
        <p>{{ hobbyAberto.texto }}</p>
        <button class="primario" @click="hobbyAberto = null">Fechar</button>
      </div>
    </div>

    <footer>
      <a href="https://pt.linkedin.com/in/jorge-amorim-316969108">LinkedIn</a>
      <a href="https://github.com/jfbamorim">GitHub</a>
    </footer>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const vistas = ['quem-sou-eu', 'o-que-faco', 'hobbies']

        function lerHash(){
            const vista = location.hash.replace('#/', '');
            return vistas.includes(vista) ? vista : 'quem-sou-eu';
        }

        const seccaoAtiva = ref(lerHash());
        const hobbyAberto = ref(null);
        const menuAberto = ref(null);
        const hobbies = [
            { nome: 'Fitboxing', texto: 'A preecnher' },
            { nome: 'Jogos de tabuleiro', texto: 'A preecnher' },
            { nome: 'Projetos Pessoais', texto: 'A preecnher' },
            { nome: 'Leitura', texto: 'A preecnher' },
            { nome: 'Aprendizagem musical', texto: 'A preecnher' }
        ];

        window.addEventListener('hashchange', () =>{
            seccaoAtiva.value = lerHash();
        });

        return { seccaoAtiva, hobbyAberto, menuAberto, hobbies };
      }
    }).mount('#app');
  </script>
</body>
</html>
